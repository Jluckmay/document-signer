name: Release

permissions:
  contents: write

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da release (ex: v1.1.0)'
        required: true
        default: 'v1.1.0'

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install desktop dependencies
        run: pip install -r desktop/requirements.txt

      - name: Build desktop executable (PyInstaller)
        shell: pwsh
        run: |
          $buildTemp = Join-Path $env:TEMP "AssinadorDigital-build"
          $certs = (Resolve-Path "backend/certs").Path
          Remove-Item -LiteralPath $buildTemp -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $buildTemp -Force | Out-Null
          py -3.11 -m PyInstaller --clean --noconfirm --onefile --windowed --name AssinadorDigital --paths backend --hidden-import verifier --collect-all PySide6 --collect-all shiboken6 --add-data "$certs;certs" --distpath dist --workpath "$buildTemp\work" --specpath $buildTemp desktop/local.py
          $buildExit = $LASTEXITCODE
          Remove-Item -LiteralPath $buildTemp -Recurse -Force -ErrorAction SilentlyContinue
          if ($buildExit -ne 0) { throw "A compilação falhou com código $buildExit / Build failed with code $buildExit" }

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist/AssinadorDigital.exe").Path
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "dist/SHA256.txt" -Value "$hash  AssinadorDigital.exe" -Encoding ascii
          Write-Host "SHA-256: $hash"

      - name: Determine release tag and version
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag || github.event.release.tag_name || github.ref_name }}"
          if (-not $tag) { throw "Não foi possível determinar a tag da release / Could not determine release tag" }
          $version = $tag.TrimStart('v')
          echo "TAG=$tag" >> $env:GITHUB_ENV
          echo "VERSION=$version" >> $env:GITHUB_ENV

      - name: Prepare bilingual release notes
        shell: pwsh
        run: |
          $version = "${{ env.VERSION }}"
          $template = Get-Content -LiteralPath ".github/release-notes.md" -Raw
          $notes = $template.Replace("{{VERSION}}", $version)
          $out = Join-Path $env:RUNNER_TEMP "release-notes.md"
          Set-Content -LiteralPath $out -Value $notes -Encoding UTF8
          echo "NOTES_FILE=$out" >> $env:GITHUB_ENV

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ env.TAG }}"
          $notesFile = "${{ env.NOTES_FILE }}"

          # Se a release já existe (disparo por tag), atualiza; caso contrário, cria.
          $existing = gh release view "$tag" --json id -q '.id' 2>$null
          if ($existing) {
            Write-Host "Atualizando release existente: $tag / Updating existing release: $tag"
            gh release edit "$tag" --notes-file "$notesFile"
          } else {
            Write-Host "Criando nova release: $tag / Creating new release: $tag"
            gh release create "$tag" --notes-file "$notesFile" --title "Assinador Digital PAdES v${{ env.VERSION }} | Digital Signer PAdES v${{ env.VERSION }}"
          }

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ env.TAG }}"
          gh release upload "$tag" dist/AssinadorDigital.exe dist/SHA256.txt --clobber
